# Docker Compose file for development

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: lms_db_dev
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - lms_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lms_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped
    networks:
      - lms_network

  # Django Backend (Development mode)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lms_backend_dev
    environment:
      - DEBUG=True
      - SECRET_KEY=django-development-secret-key
      - DJANGO_SETTINGS_MODULE=backend.settings
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - lms_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        while ! nc -z db 5432; do sleep 1; done &&
        echo 'Database is ready!' &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

  # React Frontend (Development mode)
  frontend:
    build:
      context: ./LMS frontend
      dockerfile: Dockerfile.dev
    container_name: lms_frontend_dev
    volumes:
      - ./LMS frontend:/app
      - /app/node_modules
    ports:
      - "8080:8080"
      - "3000:8080"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lms_network

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  lms_network:
    driver: bridge
